name: ClasherBid
version: 0.1.0-SNAPSHOT
main: network.clasherbid.ClasherBidPlugin
api-version: '26.2'
depend: [Vault]
commands:
  bid:
    description: Open the bidding GUI
    usage: /bid
    aliases: [auction]
  claim:
    description: Claim pending auction items
    usage: /claim
  clasherbid:
    description: Manage the active auction
    usage: /clasherbid <start|cancel|status|history|recover|settlement>
    permission: clasherbid.admin
permissions:
  clasherbid.admin:
    description: Manage auctions
    default: op
